<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure Notes{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/notes">Secure Notes</a>
    <nav aria-label="Primary navigation">
      {% if current_user %}
        <span class="identity">Signed in as {{ current_user.username }}</span>
        <a href="/notes">Notes</a>
        <form method="post" action="/export" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="link-button">Export</button>
        </form>
        {% if current_user.role == "admin" %}<a href="/admin/audit-summary">Admin</a>{% endif %}
        <form method="post" action="/logout" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="link-button">Sign out</button>
        </form>
      {% else %}
        <a href="/login">Sign in</a>
        <a href="/register">Register</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer>Local security-control demonstration. Do not use as a production deployment.</footer>
</body>
</html>
