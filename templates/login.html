{% extends "base.html" %}
{% block title %}Sign in · Secure Notes{% endblock %}
{% block content %}
<section class="card auth-card" aria-labelledby="login-heading">
  <h1 id="login-heading">Sign in</h1>
  {% if registered %}<p class="notice" role="status">Account created. You can sign in now.</p>{% endif %}
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" maxlength="64" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p>Need an account? <a href="/register">Register</a>.</p>
</section>
{% endblock %}
